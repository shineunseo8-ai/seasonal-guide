<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교원별 강의제한시간 검증</title>
<style>
body{font-family:Arial,"Malgun Gothic";background:#f4f7fb;margin:0;color:#172033}
main{max-width:1200px;margin:30px auto;padding:0 20px}
header{background:#0755a5;color:#fff;padding:28px;border-radius:14px}
.box{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:22px;margin-top:18px}
.drop{display:block;border:2px dashed #9ab7d6;padding:35px;text-align:center;cursor:pointer}
input{display:none}button{padding:11px 18px;background:#0755a5;color:#fff;border:0;border-radius:8px;font-weight:bold;margin-top:14px}
.hidden{display:none}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;margin-top:14px}th,td{padding:9px;border-bottom:1px solid #dbe3ee;white-space:nowrap;text-align:left}th{background:#edf4fb}.bad{color:#b42318}
</style>
</head>
<body>
<main>
<header><h1>교원구분별 강의제한시간 이상 검출</h1><p>Excel은 브라우저 내부에서만 처리됩니다.</p></header>
<section class="box"><h2>1. Excel 선택</h2><label class="drop">.xlsx 파일을 클릭하거나 드래그앤드롭<input id="file" type="file" accept=".xlsx"></label><div id="name">파일 없음</div><button id="run" disabled>검증 실행</button><p id="status"></p></section>
<section id="out" class="box hidden"><h2>2. 교원별 결과</h2><table><thead><tr><th>상태</th><th>매핑코드</th><th>급여직종</th><th>총 인정시수</th><th>적용한도</th><th>초과시수</th></tr></thead><tbody id="body"></tbody></table></section>
</main>
<script src="xlsx.full.min.js"></script>
<script>
const fileBox=document.getElementById('file');
const run=document.getElementById('run');
let file=null;
fileBox.onchange=()=>{file=fileBox.files[0]||null;document.getElementById('name').textContent=file?file.name:'파일 없음';run.disabled=!file};
run.onclick=async()=>{try{
  const buffer=await file.arrayBuffer();
  const workbook=XLSX.read(new Uint8Array(buffer),{type:'array',raw:false});
  const sheet=workbook.Sheets[workbook.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});
  const groups=new Map();
  rows.forEach((row,index)=>{
    const mapping=String(row['매핑코드']||'').trim();
    const job=String(row['급여직종']||'').trim();
    const value=Number(String(row['인정시수']||'').replace(/,/g,''));
    if(!groups.has(mapping))groups.set(mapping,{mapping,job,total:0,valid:true,first:index+2});
    const item=groups.get(mapping); item.total+=Number.isFinite(value)?value:0; item.valid=item.valid&&Number.isFinite(value);
  });
  document.getElementById('body').innerHTML=[...groups.values()].map(x=>`<tr class="${x.valid?'':'bad'}"><td>${x.valid?'확인 필요':'데이터 오류'}</td><td>${x.mapping}</td><td>${x.job}</td><td>${x.total.toFixed(2)}</td><td>—</td><td>—</td></tr>`).join('');
  document.getElementById('status').textContent='시트 '+workbook.SheetNames[0]+' · '+rows.length+'행을 읽었습니다.';
  document.getElementById('out').classList.remove('hidden');
}catch(error){document.getElementById('status').textContent='읽기 실패: '+error.message}};
</script>
</body>
</html>
